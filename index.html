<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Flowforge…</title>

  <!-- Prevent any caching so this version always loads -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Open Graph (LinkedIn preview) -->
  <meta property="og:title" content="Flowforge" />
  <meta property="og:description" content="Redirecting to Flowforge…" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://waelelghozzi.github.io/redirect-to-flow-forge/" />

  <meta name="robots" content="noindex, nofollow" />

  <!-- Layer 1: HTML meta refresh — fires before JS, even if JS is blocked -->
  <meta http-equiv="refresh" content="0; url=https://flow-forge-d9c.pages.dev/login">

  <!-- Layer 2: Inline JS in <head> — runs before body renders, fastest possible -->
  <script>
    window.location.replace("https://flow-forge-d9c.pages.dev/login");
  </script>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      color: #666;
    }
    a { color: #0066cc; }
  </style>
</head>
<body>
  <p>Redirecting to <a href="https://flow-forge-d9c.pages.dev/login">Flowforge</a>…</p>

  <!-- Layer 3: backup redirect in case earlier layers somehow failed -->
  <script>
    setTimeout(function () {
      window.location.href = "https://flow-forge-d9c.pages.dev/login";
    }, 100);
  </script>
</body>
</html>
