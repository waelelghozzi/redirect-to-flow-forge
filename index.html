<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Flowforge…</title>

  <!-- Open Graph tags so LinkedIn shows a preview -->
  <meta property="og:title" content="Flowforge" />
  <meta property="og:description" content="Redirecting to Flowforge…" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://waelelghozzi.github.io/redirect-to-flow-forge/" />

  <meta name="robots" content="noindex, nofollow" />

  <!-- Instant redirect as soon as the head is parsed -->
  <meta http-equiv="refresh" content="0; url=https://flow-forge-d9c.pages.dev/login">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      color: #555;
    } 
    a { color: #0066cc; }
  </style>
</head>
<body>
  <p>Redirecting to <a href="https://flow-forge-d9c.pages.dev/login">Flowforge</a>…</p>

  <script>
    // JS redirect (faster than meta refresh); fallback link stays visible if it fails
    window.location.replace("https://flow-forge-d9c.pages.dev/login");
  </script>
</body>
</html>
